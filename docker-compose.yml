version: "3.9"

services:
  # ── Python ML API ───────────────────────────────────────────────────────────
  python-api:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: leafguard-python
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=production
      - FLASK_PORT=8000
      - MODEL_PATH=model/plant_disease_model.h5
    volumes:
      - ./backend-python/model:/app/model  # mount trained model
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Node.js API Gateway ─────────────────────────────────────────────────────
  node-api:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: leafguard-node
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - PYTHON_API_URL=http://python-api:8000
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      python-api:
        condition: service_healthy
    restart: unless-stopped

  # ── React Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:5000/api
    container_name: leafguard-frontend
    ports:
      - "3000:80"
    depends_on:
      - node-api
    restart: unless-stopped

networks:
  default:
    name: leafguard-network
